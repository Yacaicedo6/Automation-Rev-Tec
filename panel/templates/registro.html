<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Crear cuenta — Revisión técnico-administrativa</title>
<link rel="icon" type="image/png" href="/static/favicon-96x96.png" sizes="96x96" />
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
<link rel="shortcut icon" href="/static/favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png" />
<link rel="manifest" href="/static/site.webmanifest" />
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html, body { height: 100%; margin: 0; }
  body { font-family: 'Inter', system-ui, sans-serif; background:#F7F7F4; color:#26251E; }
</style>
</head>
<body class="min-h-screen flex items-center justify-center py-10">
  <div class="w-full max-w-md">
    <div class="text-center mb-6">
      <div class="text-lg font-medium tracking-tight">Crear cuenta</div>
      <div class="text-xs text-[#807D72] mt-0.5">Revisión técnico-administrativa — Alcaldía de Cali</div>
    </div>
    <form method="post" action="/registro" class="bg-white border border-[#E6E5E0] rounded-xl p-6 flex flex-col gap-4">
      {% if error %}
      <div role="alert" class="bg-[#FBE3E9] text-[#cf2d56] rounded-lg px-3 py-2 text-sm">{{ error }}</div>
      {% endif %}

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label for="nombres" class="text-xs font-medium block mb-1 text-[#807D72] uppercase tracking-wide">Nombres</label>
          <input id="nombres" name="nombres" type="text" autocomplete="given-name" required value="{{ nombres_previo or '' }}"
                 class="w-full border border-[#E6E5E0] rounded-lg px-3 py-2 text-sm focus:outline-none focus-visible:ring-1 focus-visible:ring-[#F54E00]" />
        </div>
        <div>
          <label for="apellidos" class="text-xs font-medium block mb-1 text-[#807D72] uppercase tracking-wide">Apellidos</label>
          <input id="apellidos" name="apellidos" type="text" autocomplete="family-name" required value="{{ apellidos_previo or '' }}"
                 class="w-full border border-[#E6E5E0] rounded-lg px-3 py-2 text-sm focus:outline-none focus-visible:ring-1 focus-visible:ring-[#F54E00]" />
        </div>
      </div>

      <div>
        <label for="identificacion" class="text-xs font-medium block mb-1 text-[#807D72] uppercase tracking-wide">Número de identificación</label>
        <input id="identificacion" name="identificacion" type="text" spellcheck="false" required value="{{ identificacion_previa or '' }}"
               class="w-full border border-[#E6E5E0] rounded-lg px-3 py-2 text-sm focus:outline-none focus-visible:ring-1 focus-visible:ring-[#F54E00]" />
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label for="correo" class="text-xs font-medium block mb-1 text-[#807D72] uppercase tracking-wide">Correo</label>
          <input id="correo" name="correo" type="email" autocomplete="email" spellcheck="false" required value="{{ correo_previo or '' }}"
                 class="w-full border border-[#E6E5E0] rounded-lg px-3 py-2 text-sm focus:outline-none focus-visible:ring-1 focus-visible:ring-[#F54E00]" />
        </div>
        <div>
          <label for="celular" class="text-xs font-medium block mb-1 text-[#807D72] uppercase tracking-wide">Celular</label>
          <input id="celular" name="celular" type="tel" autocomplete="tel" required value="{{ celular_previo or '' }}"
                 class="w-full border border-[#E6E5E0] rounded-lg px-3 py-2 text-sm focus:outline-none focus-visible:ring-1 focus-visible:ring-[#F54E00]" />
        </div>
      </div>

      <hr class="border-[#E6E5E0]" />

      <div>
        <label for="usuario" class="text-xs font-medium block mb-1 text-[#807D72] uppercase tracking-wide">Usuario</label>
        <input id="usuario" name="usuario" type="text" autocomplete="username" spellcheck="false" required minlength="3" value="{{ usuario_previo or '' }}"
               class="w-full border border-[#E6E5E0] rounded-lg px-3 py-2 text-sm focus:outline-none focus-visible:ring-1 focus-visible:ring-[#F54E00]" />
      </div>
      <div>
        <label for="clave" class="text-xs font-medium block mb-1 text-[#807D72] uppercase tracking-wide">Contraseña</label>
        <input id="clave" name="clave" type="password" autocomplete="new-password" required minlength="6"
               class="w-full border border-[#E6E5E0] rounded-lg px-3 py-2 text-sm focus:outline-none focus-visible:ring-1 focus-visible:ring-[#F54E00]" />
        <p class="text-xs text-[#807D72] mt-1">Al menos 6 caracteres.</p>
      </div>
      <div>
        <label for="confirmacion" class="text-xs font-medium block mb-1 text-[#807D72] uppercase tracking-wide">Repite la contraseña</label>
        <input id="confirmacion" name="confirmacion" type="password" autocomplete="new-password" required minlength="6"
               class="w-full border border-[#E6E5E0] rounded-lg px-3 py-2 text-sm focus:outline-none focus-visible:ring-1 focus-visible:ring-[#F54E00]" />
      </div>

      <label class="flex items-start gap-2 text-xs text-[#807D72]">
        <input type="checkbox" name="acepto_terminos" required class="mt-0.5 rounded border-[#E6E5E0]" />
        <span>He leído y acepto los <a href="/terminos" target="_blank" class="text-[#F54E00] hover:underline">términos de uso</a> de la plataforma.</span>
      </label>

      <button type="submit" class="bg-[#F54E00] text-white rounded-lg py-2 text-sm font-medium hover:bg-[#D04200] transition-colors">
        Crear cuenta
      </button>
    </form>
    <p class="text-xs text-[#807D72] text-center mt-4">
      ¿Ya tienes cuenta? <a href="/login" class="text-[#F54E00] hover:underline">Ingresa aquí</a>.
    </p>
  </div>
</body>
</html>
