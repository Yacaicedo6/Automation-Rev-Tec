{% extends "_base.html" %}
{% block titulo %}Panorama general{% endblock %}
{% block encabezado %}Panorama general{% endblock %}

{% block contenido %}
  <div class="h-full overflow-y-auto p-6 flex flex-col gap-5">

    <p id="explicacion" class="text-sm text-[var(--text-muted)] max-w-3xl"></p>

    <div id="tarjetas-stats" class="hidden grid grid-cols-2 md:grid-cols-4 gap-3"></div>

    <div id="mensaje" class="text-sm text-[var(--text-muted)]">Cargando...</div>

    <div id="lista-grupos" class="flex flex-col gap-3 pb-6"></div>

  </div>
{% endblock %}

{% block script %}
<script>
const USUARIO_ACTUAL = {{ usuario | tojson }};

const explicacion = document.getElementById('explicacion');
const tarjetasStats = document.getElementById('tarjetas-stats');
const mensaje = document.getElementById('mensaje');
const listaGrupos = document.getElementById('lista-grupos');

function insignia(texto, tipo) {
  const colores = {
    ok: 'background:var(--badge-ok-bg);color:var(--badge-ok-text);',
    pendiente: 'background:var(--badge-pendiente-bg);color:var(--badge-pendiente-text);',
    alerta: 'background:var(--badge-alerta-bg);color:var(--badge-alerta-text);',
    neutro: 'background:var(--border);color:var(--text-main);',
  };
  return `<span class="insignia" style="${colores[tipo]}">${texto}</span>`;
}

function resumenEntidad(entidad) {
  if (entidad.alertas > 0) return insignia(`${entidad.alertas} con alerta`, 'alerta');
  if (entidad.ok === entidad.total) return insignia(`Completo ${entidad.ok}/${entidad.total}`, 'ok');
  return insignia(`En curso ${entidad.ok}/${entidad.total}`, 'pendiente');
}

function celdaEstado(estado) {
  if (estado === 'ok') return insignia('OK', 'ok');
  if (estado === 'alerta') return insignia('Alerta', 'alerta');
  return '<span class="text-[var(--text-muted)]">—</span>';
}

function tablaPersonas(grupo) {
  const codigos = Object.keys(grupo.entidades);
  let filasEncabezado = codigos.map(c => `<th class="px-2 py-1.5 text-left font-medium">${grupo.entidades[c].etiqueta}</th>`).join('');
  let filas = grupo.personas.map(persona => `
    <tr class="border-t border-[var(--border)]">
      <td class="px-2 py-1.5">${persona.nombre}</td>
      <td class="px-2 py-1.5 text-[var(--text-muted)] mono">${persona.doc}</td>
      ${codigos.map(c => `<td class="px-2 py-1.5">${celdaEstado(persona.estados[c])}</td>`).join('')}
    </tr>`).join('');
  return `
    <div class="overflow-x-auto">
      <table class="w-full text-xs border-collapse">
        <thead class="bg-[var(--bg-page)]"><tr>
          <th class="px-2 py-1.5 text-left font-medium">Persona</th>
          <th class="px-2 py-1.5 text-left font-medium">Documento</th>
          ${filasEncabezado}
        </tr></thead>
        <tbody>${filas}</tbody>
      </table>
    </div>`;
}

function tarjetaStat(etiqueta, valor, color) {
  return `
    <div class="bg-[var(--bg-card)] border-l-4 rounded-xl p-4" style="border-color:${color}">
      <div class="text-xs uppercase tracking-wide text-[var(--text-muted)] mb-1">${etiqueta}</div>
      <div class="text-2xl font-medium">${valor}</div>
    </div>`;
}

async function cargarPanorama() {
  mensaje.textContent = 'Cargando...';
  tarjetasStats.classList.add('hidden');
  listaGrupos.innerHTML = '';

  const resp = await fetch('/api/panorama');
  const datos = await resp.json();
  const grupos = datos.grupos || [];

  explicacion.textContent = datos.es_admin
    ? 'Como administrador ves un resumen del progreso de todo el equipo (solo cifras, no los archivos de cada quien).'
    : 'Aquí ves el progreso de tus propias revisiones.';

  if (grupos.length === 0) {
    mensaje.textContent = datos.es_admin
      ? 'Todavía nadie del equipo tiene una revisión creada.'
      : 'Todavía no tienes ninguna revisión creada.';
    return;
  }
  mensaje.textContent = '';

  const totalPersonas = grupos.reduce((s, g) => s + (g.total_personas || 0), 0);
  const vacias = grupos.filter(g => g.sin_datos).length;
  const conAlerta = grupos.filter(g => g.entidades && Object.values(g.entidades).some(e => e.alertas > 0)).length;

  tarjetasStats.innerHTML =
    tarjetaStat('Revisiones', grupos.length, 'var(--text-main)') +
    tarjetaStat('Personas en total', totalPersonas, 'var(--text-muted)') +
    tarjetaStat('Vacías', vacias, 'var(--badge-pendiente-text)') +
    tarjetaStat('Con alguna alerta', conAlerta, 'var(--badge-alerta-text)');
  tarjetasStats.classList.remove('hidden');

  for (const grupo of grupos) {
    const tarjeta = document.createElement('div');
    tarjeta.className = 'bg-[var(--bg-card)] border border-[var(--border)] rounded-xl p-4 flex flex-col gap-2';

    const esPropio = grupo.propietario === USUARIO_ACTUAL;
    let contenido = `<div class="flex items-center justify-between">
      <div class="font-medium text-sm">${grupo.nombre}${datos.es_admin ? ` <span class="text-xs font-normal text-[var(--text-muted)]">(${grupo.propietario})</span>` : ''}</div>
      <div class="flex items-center gap-3 shrink-0">
        ${esPropio ? `<a href="/api/lote/${encodeURIComponent(grupo.nombre)}/descargar-zip" class="text-xs text-[var(--text-muted)] hover:text-[var(--text-main)] hover:underline">Descargar (.zip)</a>` : ''}
        ${datos.es_admin ? `<button class="btn-eliminar-revision text-xs text-[var(--badge-alerta-text)] hover:underline">Eliminar</button>` : ''}
      </div>
    </div>`;

    if (grupo.carpetas_certificados && grupo.carpetas_certificados.length > 0 && esPropio) {
      contenido += `<div class="flex flex-wrap gap-1.5">
        ${grupo.carpetas_certificados.map(codigo => {
          const etiqueta = (grupo.entidades && grupo.entidades[codigo]) ? grupo.entidades[codigo].etiqueta : codigo;
          return `<a href="/api/lote/${encodeURIComponent(grupo.nombre)}/descargar-carpeta?carpeta=Cert_${encodeURIComponent(codigo)}" class="text-xs border border-[var(--border)] rounded-lg py-1 px-2 hover:bg-[var(--hover-bg)] mono">${etiqueta}.zip</a>`;
        }).join('')}
      </div>`;
    }

    if (grupo.error) {
      contenido += `<div class="text-xs text-[var(--badge-alerta-text)]">${grupo.error}</div>`;
    } else if (grupo.sin_datos) {
      contenido += `<div class="text-xs text-[var(--text-muted)]">Sin información de postulantes todavía.</div>`;
    } else {
      let fila = `<div class="flex flex-wrap items-center gap-4 text-xs">
        <span class="text-[var(--text-muted)]">${grupo.total_personas} persona(s)</span>`;
      if (grupo.pendientes_revision > 0) {
        fila += insignia(`${grupo.pendientes_revision} por revisar en el CSV`, 'alerta');
      }
      for (const entidad of Object.values(grupo.entidades)) {
        fila += `<span class="flex items-center gap-1.5"><span class="text-[var(--text-muted)]">${entidad.etiqueta}</span>${resumenEntidad(entidad)}</span>`;
      }
      fila += `</div>`;
      contenido += fila;

      if (grupo.personas && grupo.personas.length > 0) {
        contenido += `<button class="btn-ver-personas self-start text-xs text-[var(--accent)] hover:underline mt-1">Ver personas y detalle por verificación</button>`;
        contenido += `<div class="hidden detalle-personas mt-1 border border-[var(--border)] rounded-lg overflow-hidden"></div>`;
      }
    }

    tarjeta.innerHTML = contenido;
    listaGrupos.appendChild(tarjeta);

    const btnVerPersonas = tarjeta.querySelector('.btn-ver-personas');
    if (btnVerPersonas) {
      const detalle = tarjeta.querySelector('.detalle-personas');
      let cargado = false;
      btnVerPersonas.addEventListener('click', () => {
        if (!cargado) {
          detalle.innerHTML = tablaPersonas(grupo);
          cargado = true;
        }
        const visible = !detalle.classList.contains('hidden');
        detalle.classList.toggle('hidden', visible);
        btnVerPersonas.textContent = visible ? 'Ver personas y detalle por verificación' : 'Ocultar detalle';
      });
    }

    const btnEliminar = tarjeta.querySelector('.btn-eliminar-revision');
    if (btnEliminar) {
      btnEliminar.addEventListener('click', async () => {
        if (!confirm(`¿Eliminar por completo la revisión "${grupo.nombre}" de ${grupo.propietario}? Esto borra todos sus certificados y no se puede deshacer.`)) return;
        const resp = await fetch('/api/admin/eliminar-revision', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ usuario: grupo.propietario, nombre_lote: grupo.nombre }),
        });
        const resultado = await resp.json();
        if (resultado.error) {
          alert(resultado.error);
          return;
        }
        tarjeta.remove();
      });
    }
  }
}

cargarPanorama();
</script>
{% endblock %}
