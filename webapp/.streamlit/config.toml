# Esta app maneja datos personales (postulantes a convocatorias), así que se
# restringe explícitamente a que solo sea accesible desde este mismo equipo.
[server]
address = "localhost"
headless = true

[browser]
gatherUsageStats = false

# Paleta editorial cálida (inspirada en Cursor): lienzo crema, tinta casi
# negra, y un único acento naranja reservado para los botones principales.
# El resto de la personalidad (tarjetas sin sombra, insignias en pastilla)
# se aplica en _estilos.py.
[theme]
base = "light"
primaryColor = "#F54E00"
backgroundColor = "#F7F7F4"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#26251E"
font = "sans serif"
baseRadius = "medium"
